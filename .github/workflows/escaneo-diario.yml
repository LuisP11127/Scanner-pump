name: Escaneo diario

# Cada día, en cuanto cierra la vela diaria de Binance (00:00 UTC = 19:00 hora Lima), escanea la última vela
# completa de spot y futuros y guarda las monedas que subieron un 10 % o más en
# datos/seguimiento/AAAA-MM-DD.json (la fecha es la de la vela tal como la muestra Binance en hora Lima).
# Al terminar, el workflow «Web» vuelve a publicar la página con el seguimiento al día.
#
# También se lanza a mano: Actions → Escaneo diario → Run workflow (se puede elegir otra fecha).
on:
  schedule:
    - cron: "7 0 * * *"  # 00:07 UTC = 19:07 hora Lima, unos minutos después del cierre de la vela
  workflow_dispatch:
    inputs:
      fecha:
        description: "Vela a escanear (AAAA-MM-DD, fecha en hora Lima); varias, separadas por espacios. Vacío = la última vela completa"
        required: false
        default: ""
      mercado:
        description: "Mercado"
        type: choice
        default: "ambos"
        options: ["ambos", "spot", "futures"]
      guardar:
        description: "Guardar las explosiones en el seguimiento (datos/seguimiento)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: escaneo-diario
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FECHA: ${{ inputs.fecha }}
      MERCADO: ${{ inputs.mercado || 'ambos' }}
      GUARDAR: ${{ github.event_name == 'schedule' || inputs.guardar }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      # Si Binance rechaza un mercado desde los servidores de GitHub, el otro se guarda igualmente:
      # el escaneo no hace fallar el workflow y el aviso queda en el resumen.
      - name: Escanear Binance
        id: scan
        continue-on-error: true
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          os.makedirs("reportes", exist_ok=True)
          # Una o varias fechas (para volver a escanear días pasados); sin fecha, la última vela completa.
          fechas = os.environ.get("FECHA", "").replace(",", " ").split() or [""]
          salidas, code = [], 0
          for fecha in fechas:
              name = "reportes/scanner-pump" + (f"_{fecha}" if fecha else "")
              cmd = [sys.executable, "-m", "scanner_pump", "-m", os.environ["MERCADO"], "--no-abrir",
                     "--html", name + ".html", "--json", name + ".json", "--csv", name + ".csv",
                     "--seguimiento", "reportes/seguimiento"]
              if fecha:
                  cmd += ["--fecha", fecha]
              proc = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, encoding="utf-8")
              print(proc.stdout)
              salidas.append(proc.stdout.rstrip())
              code = code or proc.returncode
          pathlib.Path("reportes/salida.txt").write_text("\n\n".join(salidas) + "\n", encoding="utf-8")
          sys.exit(code)

      # Se une con lo último del repositorio (la web también guarda ahí sus escaneos) y se reintenta si
      # alguien guardó a la vez.
      - name: Guardar en el seguimiento
        if: always() && env.GUARDAR == 'true' && hashFiles('reportes/seguimiento/*.json') != ''
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            python -m scanner_pump.seguimiento reportes/seguimiento datos/seguimiento
            git add datos/seguimiento
            if git diff --cached --quiet; then
              echo "El seguimiento ya estaba al día."
              exit 0
            fi
            dias=$(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd ' ' -)
            git commit --quiet -m "Seguimiento: velas del $dias (escaneo automático)"
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Seguimiento guardado: $dias"
              exit 0
            fi
            sleep $((intento * 5))
          done
          echo "::error title=Seguimiento sin guardar::No se pudo subir el seguimiento tras varios intentos."
          exit 1

      - name: Resumen
        if: always()
        shell: python
        run: |
          import os, pathlib
          salida = pathlib.Path("reportes/salida.txt")
          text = salida.read_text(encoding="utf-8").rstrip() if salida.exists() else "Sin salida"
          lines = [f"## Scanner-pump · {os.environ['MERCADO']}", "", "```", text, "```", "",
                   "Descarga el informe con los gráficos en **Artifacts → scanner-pump**, al final de esta página."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          if "${{ steps.scan.outcome }}" != "success":
              print("::warning title=Escaneo incompleto::Algún mercado no se pudo escanear; revisa el resumen. "
                    "Puedes completarlo escaneando desde la web.")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-pump
          path: reportes/
          retention-days: 14
